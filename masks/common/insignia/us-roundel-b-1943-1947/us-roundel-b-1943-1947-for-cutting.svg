<!--
  US Roundel "star and bars" (AN-I-9b, Aug 1943 - Jan 1947) - color-change
  edges only, for single-sheet paint masking: cut this, then peel individual
  regions to spray each color in turn, leaving the rest of the mask in
  place.

  Derived from us-roundel-b-1943-1947-wikimedia.svg (same folder) by
  computing the exact boolean geometry of the final flattened artwork
  (outer disk union outer bar, minus the white bar not covered by the inner
  disk, minus the star) via Shapely - NOT just overlaying each source
  shape's raw outline, which would leave the bar/disk edges cutting through
  the middle of the star and other regions that are meant to be a single
  color. The result is one closed outer boundary (background/navy edge)
  plus three holes (the two white bar-remainder pieces and the star) - every
  line in this file is either the overall outer edge or an actual color
  change, nothing else. Same 1270x700 coordinate system as the master file
  (no inherent real-world scale - scale to size when embedding, and
  recompute stroke-width for the target scale so cut lines end up a
  consistent real-world thickness).
-->
